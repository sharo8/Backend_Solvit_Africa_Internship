<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${subject} ?: 'SOLVIT Africa'">SOLVIT Africa</title>
</head>
<body style="font-family: Arial, sans-serif; background:#f8fafc; margin:0; padding:0;">
<div style="max-width:680px; margin:0 auto; padding:24px;">
    <div style="display:flex; align-items:center; gap:12px; padding:14px 18px; background:#ffffff; border-radius:12px; border:1px solid #e5e7eb;">
        <img th:src="${logoUrl}" alt="SOLVIT Africa" style="width:42px; height:42px; border-radius:10px;"/>
        <div>
            <div style="font-size:18px; font-weight:700; color:[[${brandColor}]];">SOLVIT Africa</div>
            <div style="font-size:14px; color:#6b7280;" th:text="${header}">Automated Notification</div>
        </div>
    </div>

    <div style="margin-top:18px; background:#ffffff; border-radius:12px; border:1px solid #e5e7eb; padding:18px;">
        <p style="margin:0 0 10px 0; color:#111827;" th:text="|Hello ${firstName},|">Hello,</p>
        <p style="margin:0 0 14px 0; color:#374151;" th:text="${message}">Message</p>

        <div style="background:#f3f4f6; border-radius:12px; padding:14px; border:1px solid #e5e7eb;">
            <div style="font-size:14px; font-weight:700; margin-bottom:6px; color:#0f172a;">Task details</div>
            <div style="font-size:14px; color:#334155; margin:2px 0;" th:text="|Title: ${taskTitle}|">Title</div>
            <div style="font-size:14px; color:#334155; margin:2px 0;" th:text="|Priority: ${priority}|">Priority</div>
            <div style="font-size:14px; color:#334155; margin:2px 0;" th:text="|Due date: ${dueDate}|">Due date</div>
            <div style="font-size:14px; color:#334155; margin:2px 0;" th:text="|Status: ${status}|">Status</div>
            <div style="font-size:14px; color:#334155; margin:2px 0;" th:text="|Assigned By: ${assignedBy}|">Assigned By</div>
        </div>

        <div style="margin-top:16px;">
            <a th:href="${ctaUrl}" style="display:inline-block; background:[[${brandColor}]]; color:#ffffff; text-decoration:none; padding:12px 18px; border-radius:10px; font-weight:700;">View Task →</a>
        </div>
    </div>

    <div style="margin-top:16px; text-align:center; color:#6b7280; font-size:12px;">
        SOLVIT Africa Internship System | This is an automated message
    </div>
</div>
</body>
</html>
