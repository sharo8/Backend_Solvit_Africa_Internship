# ===================================
# JPA/HIBERNATE CONFIGURATION
# ===================================
# Dev default: Hibernate evolves schema. Flyway V1 creates/rebuilds `evaluations` (Task 3); other entities still rely on update.
# For production, prefer ddl-auto=validate (or none) once the full schema is managed by migrations.
spring.jpa.hibernate.ddl-auto=update

# Flyway (Task 3 evaluations table). baseline-on-migrate: existing DBs without flyway_schema_history get a baseline then V1 runs.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
# Clear failed migration entries / checksum drift before migrate (see FlywayConfig). Set false only if you manage Flyway manually.
app.flyway.repair-before-migrate=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

