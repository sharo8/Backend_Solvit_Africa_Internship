# ===================================
# LOGGING CONFIGURATION
# ===================================
# Task list/stats: search the backend console for "[tasks]" (INFO/WARN) to see role, filters, totalElements.
# Temporary task debugging: [CurrentUser], [TaskController.list], [supervisorScope], [TaskService.search], [TaskService.stats], [DEBUG] raw SQL count
logging.level.root=INFO
logging.level.com.solvit.internship_system=DEBUG
logging.level.com.solvit.internship_system.service.TaskService=DEBUG
logging.level.com.solvit.internship_system.controller.TaskController=DEBUG
logging.level.com.solvit.internship_system.security=DEBUG
logging.level.com.solvit.internship_system.config=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.mail=DEBUG
logging.level.org.springframework.transaction=DEBUG
logging.level.org.springframework.orm.jpa=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Password reset token validity (24 hours)
